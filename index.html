<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#120906"><title>Mi Biblioteca Personal</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#120906;color:#f2dfbd;font-family:system-ui}.app{max-width:1000px;margin:auto;padding:16px}h1{font-family:Georgia,serif}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,input{font:inherit}button{padding:10px 14px;border-radius:9px;border:1px solid #8b6033;background:#563018;color:#f3dfb9}.hidden{display:none!important}.auth,.stage{background:#21130d;border:1px solid #5a3823;border-radius:14px;padding:18px}.auth{max-width:500px;margin:30px auto}.auth input{width:100%;padding:12px;margin:6px 0;background:#120b07;color:white;border:1px solid #705039;border-radius:8px}.case{margin-top:15px;border:10px solid #3d2111;border-radius:14px;background:radial-gradient(circle at 25% 0,#6b431d,#2a160b 30%,#160c07 72%);padding:40px 10px 0;box-shadow:inset 0 18px 35px #0009}.lights{display:flex;justify-content:space-around;margin:-34px 0 16px}.lights i{width:25px;height:8px;border-radius:50%;background:#ffd38a;box-shadow:0 0 18px 6px #ffb13b44}.shelf{min-height:280px;display:flex;gap:7px;align-items:flex-end;overflow:auto;border-bottom:20px solid #6b3a19;padding:0 8px}.spine{position:relative;min-width:54px;width:54px;color:#e8c778;display:flex;align-items:center;justify-content:center;border:1px solid #d4ad6b55;border-radius:6px 6px 2px 2px;box-shadow:inset 5px 0 #fff1,inset -7px 0 #0006,3px 5px 8px #0006;transition:.35s;transform-origin:bottom}.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font:12px Georgia,serif;padding:7px}.spine.active{transform:translateY(22px);opacity:.18}.stage{margin-top:16px}.scene{min-height:370px;display:flex;justify-content:center;align-items:center;perspective:1600px;overflow:hidden}.book{position:relative;width:205px;height:305px;transform-style:preserve-3d;animation:extract .9s cubic-bezier(.18,.8,.2,1);transform:rotateY(-10deg) rotateX(2deg) translateZ(20px)}.cover{position:absolute;inset:0;transform-origin:left center;transition:transform .95s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;z-index:4}.book.open .cover{transform:rotateY(-158deg)}.front{position:absolute;inset:0;background:#4d2816;border:2px solid #a8753c;border-radius:7px 11px 11px 7px;overflow:hidden;backface-visibility:hidden;box-shadow:20px 23px 34px #0009}.front img{width:100%;height:100%;object-fit:cover}.fallback{height:100%;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:20px;font-family:Georgia,serif;background:linear-gradient(145deg,#5b321b,#160b07)}.inside{position:absolute;inset:0;background:#6a4329;transform:rotateY(180deg);backface-visibility:hidden;border-radius:11px 7px 7px 11px}.paper{position:absolute;inset:7px 4px 7px 8px;background:repeating-linear-gradient(to bottom,#efe1bd 0 2px,#dfcca0 2px 3px);border-radius:5px 10px 10px 5px;box-shadow:inset -9px 0 #cdb98c,6px 3px 0 #b49c70;z-index:2}.edge{position:absolute;right:-9px;top:10px;width:10px;height:285px;background:repeating-linear-gradient(to bottom,#f1e5c4 0 2px,#c9b68e 2px 3px);transform:rotateY(90deg);transform-origin:left;z-index:1}.book.returning{animation:returnBook .8s ease forwards}.pages{display:grid;grid-template-columns:1fr 1fr;max-width:760px;margin:20px auto;animation:reveal .6s ease}.page{background:#efe1bd;color:#352619;padding:25px;min-height:360px;font-family:Georgia,serif;border:1px solid #b89b68}.page:first-child{border-radius:12px 2px 2px 12px;background-image:linear-gradient(to left,#4c321c22,transparent 15%)}.page:last-child{border-radius:2px 12px 12px 2px;background-image:linear-gradient(to right,#4c321c22,transparent 15%)}.muted{color:#bda989}@keyframes extract{0%{transform:translateY(120px) scale(.42) rotateY(82deg);opacity:0}65%{transform:translateY(-8px) scale(1.03) rotateY(-16deg);opacity:1}100%{transform:rotateY(-10deg) rotateX(2deg) translateZ(20px);opacity:1}}@keyframes returnBook{from{transform:rotateY(-10deg) translateZ(20px);opacity:1}to{transform:translateY(120px) scale(.42) rotateY(82deg);opacity:0}}@keyframes reveal{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}@media(max-width:600px){.pages{grid-template-columns:1fr}.page{min-height:0;border-radius:9px!important}.shelf{min-height:240px}.scene{min-height:340px}}
</style></head><body><main class="app"><h1>Mi biblioteca personal</h1><div id="stats" class="muted">Biblioteca privada</div><section id="auth" class="auth"><h2>Entrar</h2><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><div class="row"><button id="login">Entrar</button><button id="logout" class="hidden">Salir</button></div><small id="msg"></small></section><section id="library" class="hidden"><div class="case"><div class="lights"><i></i><i></i><i></i></div><div id="shelf" class="shelf"></div><p style="text-align:center">Toca un lomo para sacar el libro</p></div><section class="stage"><div id="empty" style="text-align:center;padding:35px" class="muted">Elige un libro.</div><div id="detail" class="hidden"><div class="row"><button id="back">← Devolver al estante</button><button id="fav">♡ Favorito</button></div><div id="scene" class="scene"><button id="bookBtn" style="border:0;background:none"><div id="book" class="book"><div class="paper"></div><div class="edge"></div><div class="cover"><div class="front"><img id="cover" class="hidden"><div id="fallback" class="fallback"></div></div><div class="inside"></div></div></div></button></div><p id="hint" class="muted" style="text-align:center">Toca la portada para abrir el libro.</p><div id="pages" class="pages hidden"><article class="page"><small id="status"></small><h2 id="title"></h2><p id="author"></p><p id="rating"></p><p id="dates"></p><p id="progress"></p></article><article class="page"><small>MI OPINIÓN</small><p id="opinion"></p><hr><small>RESEÑA</small><p id="review"></p><hr><small>NOTAS</small><p id="notes"></p></article></div></div></section></section></main>
<script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm';const sb=createClient('https://yupfxglvbeqyutbxhzyo.supabase.co','sb_publishable_QvauD8Il5OlAhGi_abLBbw_WjqWXzaK'),$=s=>document.querySelector(s);let books=[],active=null,activeSpine=null;const colors=['#17372a','#6a351d','#193459','#87603c','#183e49','#225247','#6c262a','#826c3d','#233751'];const latest=b=>[...(b.readings||[])].sort((a,c)=>(c.reading_number||0)-(a.reading_number||0))[0]||{};async function load(){let{data,error}=await sb.from('books').select('id,title,author,cover_url,spine_color,total_pages,favorite,readings(status,started_on,finished_on,rating,review,personal_opinion,reading_number,current_page,notes)').order('created_at');if(error)return $('#stats').textContent=error.message;books=data||[];$('#stats').textContent=books.length+' libros · '+books.filter(b=>latest(b).status==='terminado').length+' terminados · '+books.filter(b=>latest(b).status==='leyendo').length+' leyendo';$('#shelf').innerHTML='';books.forEach((b,i)=>{let x=document.createElement('button');x.className='spine';x.style.height=190+(i%4)*18+'px';x.style.background='linear-gradient(90deg,'+(b.spine_color||colors[i%colors.length])+',#160b07)';x.innerHTML='<span></span>';x.querySelector('span').textContent=b.title;x.onclick=()=>{document.querySelectorAll('.spine').forEach(s=>s.classList.remove('active'));x.classList.add('active');activeSpine=x;show(b)};$('#shelf').append(x)})}function show(b){active=b;let r=latest(b);$('#empty').classList.add('hidden');$('#detail').classList.remove('hidden');$('#scene').classList.remove('hidden');$('#pages').classList.add('hidden');$('#hint').classList.remove('hidden');$('#book').className='book';$('#cover').classList.toggle('hidden',!b.cover_url);$('#fallback').classList.toggle('hidden',!!b.cover_url);if(b.cover_url)$('#cover').src=b.cover_url;$('#fallback').innerHTML='<small>'+((b.author||'').toUpperCase())+'</small><h2>'+b.title+'</h2><div style="font-size:38px">✦</div>';$('#title').textContent=b.title;$('#author').textContent=b.author||'';$('#status').textContent=r.status||'pendiente';$('#rating').textContent=r.rating==null?'Sin calificar':r.rating+' / 5 ★';$('#dates').textContent='Inicio: '+(r.started_on||'—')+' · Término: '+(r.finished_on||'—');$('#progress').textContent=b.total_pages&&r.current_page!=null?'Progreso: '+r.current_page+' / '+b.total_pages:'';$('#opinion').textContent=r.personal_opinion||'Aún sin opinión.';$('#review').textContent=r.review||'Aún sin reseña.';$('#notes').textContent=r.notes||'Sin notas.';$('#fav').textContent=b.favorite?'♥ Favorito':'♡ Favorito'}$('#bookBtn').onclick=()=>{$('#book').classList.add('open');setTimeout(()=>{$('#scene').classList.add('hidden');$('#hint').classList.add('hidden');$('#pages').classList.remove('hidden')},820)};$('#back').onclick=()=>{$('#pages').classList.add('hidden');$('#scene').classList.remove('hidden');$('#hint').classList.add('hidden');let b=$('#book');b.classList.remove('open');b.classList.add('returning');setTimeout(()=>{$('#detail').classList.add('hidden');$('#empty').classList.remove('hidden');if(activeSpine)activeSpine.classList.remove('active');activeSpine=null;active=null},760)};$('#fav').onclick=async()=>{if(!active)return;let v=!active.favorite;let{error}=await sb.from('books').update({favorite:v}).eq('id',active.id);if(!error){active.favorite=v;$('#fav').textContent=v?'♥ Favorito':'♡ Favorito'}};$('#login').onclick=async()=>{let{error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});$('#msg').textContent=error?error.message:''};$('#logout').onclick=()=>sb.auth.signOut();async function session(s){$('#auth').classList.toggle('hidden',!!s);$('#library').classList.toggle('hidden',!s);$('#logout').classList.toggle('hidden',!s);if(s)await load()}const{data:{session:s}}=await sb.auth.getSession();await session(s);sb.auth.onAuthStateChange((_e,s)=>session(s));</script></body></html>
